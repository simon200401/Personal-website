<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Simon Xu · One desk, ten universes</title>
  <meta name="description" content="Simon Xu 的个人网站：一张桌子，十个宇宙。">
  <meta property="og:title" content="Simon Xu · One desk, ten universes">
  <meta property="og:description" content="Click the mask to switch universe.">
  <meta property="og:image" content="assets/styles/comic@1x.webp?v=20261018-1">
  <meta name="theme-color" content="#14121c">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/main.css?v=20261018-1">
  <link rel="stylesheet" href="css/news.css">
  <link rel="stylesheet" href="css/mobile.css?v=20261011-1">
  <link rel="preload" as="image" href="assets/styles/comic@1x.webp?v=20261018-1">
</head>
<body>
  <div id="loader" role="status">
    <div class="loader-card">
      <p class="loader-name">SIMON</p>
      <p id="loader-text">Crossing universes…</p>
      <div class="loader-track"><div id="loader-bar"></div></div>
    </div>
  </div>

  <canvas id="stage" role="img" tabindex="0"></canvas>
  <canvas id="fx" aria-hidden="true"></canvas>

  <header class="hud hud-top">
    <a class="logo" href="./" aria-label="Simon">simon<sup>°</sup></a>
    <nav class="nav" aria-label="视图">
      <button id="btn-sound" type="button" class="pill"></button>
      <button id="btn-lang" type="button" class="pill"></button>
      <button id="btn-desk" type="button" class="pill" aria-pressed="true"></button>
      <button id="btn-intro" type="button" class="pill" aria-pressed="false"></button>
    </nav>
  </header>

  <footer class="hud hud-bottom">
    <p id="earth" class="caption"></p>
    <div id="dots" class="dots" role="group" aria-label="Universes"></div>
    <p id="hint" class="hint"></p>
    <div id="map" class="map" aria-hidden="true" hidden><i id="map-view"></i></div>
  </footer>

  <p id="tip" class="caption tip" hidden></p>
  <p id="sfx" class="sfx" aria-hidden="true"></p>

  <aside id="panel" class="panel" hidden>
    <button id="back" type="button" class="pill back"></button>
    <div id="panel-body" class="panel-body"></div>
  </aside>

  <main id="intro" class="intro" hidden>
    <div id="intro-body" class="intro-body"></div>
  </main>

  <noscript>
    <div class="noscript">
      <h1>Simon Xu</h1>
      <p>这个页面需要 JavaScript。<a href="https://github.com/simon200401">GitHub</a></p>
    </div>
  </noscript>

  <script type="module" src="js/app.js?v=20261018-2"></script>
</body>
</html>
